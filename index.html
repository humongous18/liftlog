<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Liftlog</title>
<meta name="theme-color" content="#050708">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Liftlog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow";src:url(fonts/barlow-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
/* Layout: phone-first dark console. Score dials on top, a few tiles below; tab bar at the bottom (left rail on wide screens); an exercise opens as a full-height sheet. */
:root{
  --bg:#050708; --tile:#111518; --tile2:#1a2024; --hair:#232a2f;
  --fg:#f2f5f6; --mute:#a3aeb5; --dim:#7d8a93;
  --green:#16ec06; --yellow:#ffde00; --red:#ff3b4e; --blue:#0093e7; --link:#4cbaff;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-tile:22px; --r-btn:12px; --r-in:9px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);height:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{color:var(--fg);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
/* App feel: labels, headings and numbers aren't selectable and long-press shows no copy menu; fields you type in still are. */
html{touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-size:18px;font-weight:600;line-height:1.25}
h3{font-size:15px;font-weight:600;color:var(--mute)}
.sub{color:var(--mute);font-size:15px;margin-top:4px}
.muted{color:var(--mute)}
.muted b{color:var(--fg);font-weight:600}
.small{font-size:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* shell */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--hair);
  padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
#nav .brand{display:none}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;color:var(--dim);text-decoration:none;font-size:11px;font-weight:600}
#nav a svg{width:24px;height:24px}
#nav a.on{color:var(--fg)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  #nav{top:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;gap:2px;border-top:0;border-right:1px solid var(--hair);padding:28px 12px 20px max(12px,env(safe-area-inset-left,0px))}
  #nav .brand{display:block;padding:0 12px 24px;font-family:var(--f-num);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.06em}
  #nav a{flex:none;flex-direction:row;gap:12px;padding:10px 12px;font-size:15px;border-radius:10px}
  #nav a:hover{color:var(--fg)}
  #nav a.on{background:var(--tile2)}
  #main{margin-left:210px}
  .wrap{padding-block:32px 60px}
}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;margin-bottom:22px}
.top .t{min-width:0}
.who{display:inline-flex;background:var(--tile);border-radius:999px;padding:3px}
.who button{height:34px;padding:0 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--mute)}
.who button.on{background:var(--fg);color:var(--bg)}
.banner{padding:12px 14px;border-radius:var(--r-btn);background:#2a1a10;color:#ffd7b0;font-size:15px;margin-bottom:16px}

/* dials */
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.dial{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.dial .ring{position:relative;width:100%;max-width:170px;aspect-ratio:1}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--f-num);font-weight:700;font-size:clamp(28px,8.6vw,48px);font-variant-numeric:tabular-nums;line-height:1}
.dial .val small{font-size:.5em;color:var(--mute);font-weight:600}
.dial .lbl{font-weight:600;font-size:15px}
.coach{color:var(--mute);font-size:16px;text-align:center;max-width:46ch;margin:0 auto 18px}
.coach b{color:var(--fg);font-weight:600}

/* tiles */
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.tile{background:var(--tile);border-radius:var(--r-tile);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.tile-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 10px}
.fig{display:flex;flex-direction:column;min-width:0}
.fig b{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.fig b small{font-size:.55em;color:var(--mute);font-weight:600;margin-left:2px}
.fig span{font-size:14px;color:var(--mute)}
.empty{color:var(--mute);font-size:15px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.section:first-child{margin-top:0}

/* bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:88px minmax(0,1fr) 44px;align-items:center;gap:10px;font-size:15px}
.hb .tr{height:8px;border-radius:4px;background:var(--tile2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:4px}
.hb .v{text-align:right;font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums}
.hb .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;border-radius:10px}
.wd .col{width:100%;max-width:26px;height:80px;border-radius:6px;background:var(--tile2);position:relative;overflow:hidden}
.wd .col i{position:absolute;left:0;right:0;bottom:0;background:var(--blue)}
.wd .s{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.wd .r{width:8px;height:8px;border-radius:50%;background:var(--c,var(--tile2))}
.wd .l{font-size:13px;color:var(--dim);font-weight:500}
.wd.today .l{color:var(--fg)}
.wd.future .col{opacity:.45}
.wkgoal{font-size:15px;color:var(--mute)}
.wkgoal b{font-family:var(--f-num);font-size:24px;font-weight:700;color:var(--fg);margin-right:1px}
.figs.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:var(--r-btn);background:var(--tile2);font-weight:600;font-size:16px;color:var(--fg)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--blue);color:#fff}
.btn.wide{width:100%}
.btn.danger{color:var(--red)}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px}
.actions{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.tbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 12px;color:var(--link);font-weight:600;font-size:15px;border-radius:10px}
.tbtn svg{width:18px;height:18px}
.tbtn.danger{color:var(--red)}
.link{color:var(--link);font-weight:600;font-size:15px;text-align:left}
.link.danger{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--tile);color:var(--mute);font-weight:600;font-size:15px;white-space:nowrap}
.tile .chip{background:var(--tile2)}
.chip.on,.tile .chip.on{background:var(--fg);color:var(--bg)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.scroller::-webkit-scrollbar{display:none}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tile);flex:none}
.icon-btn svg{width:22px;height:22px}
.tile .icon-btn{background:var(--tile2);font-size:24px}
.txt{width:100%;min-height:48px;padding:11px 13px;border-radius:var(--r-in);background:var(--tile2);border:1px solid transparent;color:var(--fg);font-size:16px}
textarea.txt{min-height:80px;resize:vertical}
.txt:focus{outline:none;border-color:var(--link)}
.txt::placeholder{color:var(--dim)}
.seg{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.seg.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg button{height:40px;border-radius:8px;background:var(--tile2);font-family:var(--f-num);font-weight:700;font-size:17px;color:var(--mute)}
.seg button.on{background:var(--sc,var(--blue));color:var(--onc,#fff)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:-1px}
.field{display:flex;flex-direction:column;gap:7px}
.field > span, .field > label{font-size:14px;color:var(--mute);font-weight:500}
.rowsb{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row > .txt{flex:1;min-width:0}

/* log */
.dayhdr{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-bottom:6px}
.daylbl{position:relative;text-align:center;padding:4px 0}
.daylbl h1{font-size:30px}
.daylbl .sub{margin-top:2px}
.daylbl input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.dayline{display:flex;justify-content:center;gap:4px 14px;flex-wrap:wrap;color:var(--mute);font-size:15px;margin:6px 0 16px}
.dayline b{font-family:var(--f-num);font-size:19px;color:var(--fg);font-weight:700}
.dayline .st b{color:var(--link)}
.entries{display:flex;flex-direction:column;gap:10px}
.entries{gap:8px!important}
.entry{display:block;text-align:left;width:100%;background:var(--tile);border-radius:14px;padding:10px 14px}
.entry-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
.entry-h b{font-size:16px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sline{display:flex;flex-wrap:wrap;gap:2px 14px;font-family:var(--f-num);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.sline .sg{display:inline-flex;align-items:center;gap:4px}
.sline .x{color:var(--mute)}
.enote{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry-h span{font-size:14px;color:var(--mute);white-space:nowrap}
.sets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sets li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;font-family:var(--f-num);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.sets li .n{color:var(--dim);font-size:16px}
.sets li .c{grid-column:2/-1;font-family:var(--f-body);font-size:14px;color:var(--mute);margin-top:-3px}
.pr{color:var(--yellow);display:inline-flex}
.pr svg{width:17px;height:17px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{text-align:center;font-size:13px;color:var(--dim);padding-bottom:4px;font-weight:600}
.cd{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--tile);display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;text-align:left;min-width:0;overflow:hidden;border:1.5px solid transparent}
.cd .d{font-family:var(--f-num);font-weight:600;font-size:15px;color:var(--dim)}
.cd.has .d{color:var(--fg)}
.cd.out{visibility:hidden}
.cd.today{border-color:var(--fg)}
.cd .dots{display:flex;gap:3px;flex-wrap:wrap}
.cd .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--c)}

/* calendar (scrolling months, FitNotes-style) */
.cmonth{scroll-margin-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:6px}
.cmh{text-align:center;font-family:var(--f-num);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:22px 0 12px}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px;max-width:560px;margin:0 auto}
.cdow{text-align:center;font-size:13px;font-weight:600;color:var(--mute);padding-bottom:10px}
.cday{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0 6px;min-width:0}
.cday .n{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;font-size:20px;font-variant-numeric:tabular-nums}
.cday.today .n{background:var(--blue);color:#fff;font-weight:600}
.cday .dots{display:flex;gap:3px;height:7px}
.cday .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.calwrap{padding-bottom:calc(var(--navh,64px) + 96px)!important}
.calbar{position:fixed;z-index:25;left:0;right:0;bottom:calc(var(--navh,0px) - 1px);display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:6px max(16px, env(safe-area-inset-right,0px)) 6px max(16px, env(safe-area-inset-left,0px));background:var(--tile);border-top:1px solid var(--hair)}
@media (min-width:900px){.calbar{left:226px;right:16px;bottom:16px;border-radius:14px;border-top:0}.calwrap{padding-bottom:110px!important}}
.calbar b{text-align:center;font-family:var(--f-num);font-weight:600;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.calbar .icon-btn{background:transparent;color:var(--link)}
.calbar .icon-btn svg{width:26px;height:26px}

/* charts */
.chart{width:100%;min-width:0}
.chart svg{display:block}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.65)}
#sheet .sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:760px){#sheet .sheet{left:auto;width:540px;border-left:1px solid var(--hair)}}
.sh-top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.sh-title{min-width:0;flex:1}
.sh-title h2{font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-title p{font-size:14px;color:var(--mute)}
.tabs{display:flex;border-bottom:1px solid var(--hair);padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;padding:12px 0;font-weight:600;font-size:15px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--fg);border-color:var(--fg)}
.sh-body > *{flex-shrink:0}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(130px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stepper{display:grid;grid-template-columns:60px minmax(0,1fr) 60px;height:66px;border-radius:16px;overflow:hidden;background:var(--tile)}
.stepper button{font-size:28px;color:var(--mute)}
.stepper button:active{background:var(--tile2);color:var(--fg)}
.stepper input{min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-weight:700;font-size:34px;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;background:var(--tile2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.restcard{background:var(--tile);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rc-lbl{font-size:14px;color:var(--mute)}
.rc-time{font-family:var(--f-num);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.restcard .btn.sm{min-width:52px;font-family:var(--f-num);font-weight:700;font-size:16px}
.rc-bar{height:6px;border-radius:3px;background:var(--tile2);overflow:hidden}
.rc-bar i{display:block;height:100%;width:100%;background:var(--link);border-radius:3px}
.last{color:var(--mute);font-size:15px}
.last .pill{color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;margin:0 6px 6px 0;border-radius:999px;background:var(--tile2);font-family:var(--f-num);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.pill .pr svg{width:14px;height:14px}
.setlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);align-items:baseline;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--hair)}
.trow.sel{background:var(--tile);border-radius:12px;border-color:transparent}
.trow .tn{display:flex;align-items:center;gap:6px;padding-left:6px;font-family:var(--f-num);font-weight:600;font-size:22px;align-self:center}
.trow .tn .pr svg{width:17px;height:17px}
.sh-top{position:relative}
.menu-scrim{position:fixed;inset:0;z-index:51}
.menu{position:absolute;z-index:52;top:calc(100% - 4px);right:max(12px,env(safe-area-inset-right,0px));min-width:220px;background:var(--tile2);border-radius:14px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.7);display:flex;flex-direction:column}

<script>
(() => {
'use strict';
/* ================= constants ================= */
const LB = 0.45359237, MI = 1.609344;
const CATS = {
  chest:{name:'Chest',c:'#ff7a59'}, back:{name:'Back',c:'#4c9bff'}, shoulders:{name:'Shoulders',c:'#ffb547'},
  legs:{name:'Legs',c:'#9b87ff'}, biceps:{name:'Biceps',c:'#2dd4bf'}, triceps:{name:'Triceps',c:'#e879f9'},
  abs:{name:'Abs',c:'#c6f432'}, cardio:{name:'Cardio',c:'#ff4f7b'}, other:{name:'Other',c:'#9aa7b0'}
};
const CAT_ORDER = ['chest','back','shoulders','legs','biceps','triceps','abs','cardio','other'];
const TYPES = {wr:'Weight and reps', r:'Reps', t:'Time', dt:'Distance and time'};
const COLORS = ['#4cbaff','#ff7ab6','#ffb547','#2dd4bf','#b48cff'];
const RAW = `chest|wr|Flat Barbell Bench Press;Incline Barbell Bench Press;Decline Barbell Bench Press;Flat Dumbbell Bench Press;Incline Dumbbell Bench Press;Flat Dumbbell Fly;Cable Crossover;Machine Chest Press;Pec Deck
chest|r|Push Up;Chest Dip
back|wr|Deadlift;Barbell Row;Dumbbell Row;Lat Pulldown;Seated Cable Row;T-Bar Row;Machine Row;Rack Pull;Face Pull
back|r|Pull Up;Chin Up;Hyperextension
shoulders|wr|Overhead Press;Seated Dumbbell Press;Arnold Press;Machine Shoulder Press;Lateral Raise;Cable Lateral Raise;Front Raise;Rear Delt Fly;Upright Row;Barbell Shrug;Dumbbell Shrug
legs|wr|Barbell Squat;Front Squat;Romanian Deadlift;Leg Press;Hack Squat;Goblet Squat;Bulgarian Split Squat;Walking Lunge;Leg Extension;Lying Leg Curl;Seated Leg Curl;Hip Thrust;Hip Abduction;Standing Calf Raise;Seated Calf Raise
biceps|wr|Barbell Curl;EZ-Bar Curl;Dumbbell Curl;Hammer Curl;Incline Dumbbell Curl;Preacher Curl;Cable Curl;Concentration Curl
triceps|wr|Close Grip Barbell Bench Press;Rope Push Down;V-Bar Push Down;Overhead Cable Triceps Extension;EZ-Bar Skullcrusher;Dumbbell Overhead Triceps Extension;Cable Kickback
triceps|r|Parallel Bar Triceps Dip
abs|wr|Cable Crunch
abs|r|Crunch;Hanging Leg Raise;Ab Wheel Rollout;Russian Twist;Dragon Flag
abs|t|Plank;Side Plank
cardio|dt|Running;Treadmill;Cycling;Stationary Bike;Rowing Machine;Elliptical Trainer;Walking;Swimming
cardio|t|Stair Climber;Jump Rope`;
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'x';
const BUILTIN = {};
RAW.split('\n').forEach(line => { const [cat,type,names] = line.split('|'); names.split(';').forEach(n => { BUILTIN[slug(n)] = {id:slug(n), name:n, cat, type}; }); });

const IC = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V17h3v3H8v-3h3v-2.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3V3zm0 4H6v1a2 2 0 0 0 1 1.7V7zm10 0v2.7A2 2 0 0 0 18 8V7h-1z"/></svg>',
  timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>'
};

/* ================= helpers ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d||1); };
const addDays = (s,n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const weekStart = s => { const d = parseISO(s); return addDays(s, -((d.getDay()+6)%7)); };
const fmtNum = (n,d=0) => Number(n).toLocaleString(undefined,{maximumFractionDigits:d});
const fmtDateLong = s => parseISO(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const fmtDateShort = s => { const d = parseISO(s); const o = {month:'short',day:'numeric'}; if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric'; return d.toLocaleDateString(undefined,o); };
const relDay = s => { const t = today(); if (s===t) return 'Today'; if (s===addDays(t,-1)) return 'Yesterday'; if (s===addDays(t,1)) return 'Tomorrow'; return parseISO(s).toLocaleDateString(undefined,{weekday:'long'}); };
const e1rm = (w,r) => !w || !r ? 0 : r === 1 ? w : w * (1 + Math.min(r,15)/30);
const strainOf = load => 21 * (1 - Math.exp(-load/130));
const recColor = v => v >= 67 ? 'var(--green)' : v >= 34 ? 'var(--yellow)' : 'var(--red)';
const wRaw = (kg,u) => Math.round((u==='lb' ? kg/LB : kg)*100)/100;
const fmtW = (kg,u) => fmtNum(wRaw(kg,u),2);
const fmtE = (kg,u) => fmtNum(wRaw(kg,u), u==='lb' ? 0 : 1);
const wUnit = u => u==='lb' ? 'lbs' : 'kg';
const distU = u => u==='lb' ? 'mi' : 'km';
const dRaw = (km,u) => Math.round((u==='lb' ? km/MI : km)*100)/100;
const fmtVol = (kg,u) => { const v = u==='lb' ? kg/LB : kg; return v >= 100000 ? fmtNum(v/1000,0)+'k' : v >= 10000 ? fmtNum(v/1000,1)+'k' : fmtNum(v,0); };
function fmtDur(sec){ sec = Math.round(sec||0); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }
function fmtDurH(sec){ sec = Math.round(sec||0); return `${Math.floor(sec/3600)}:${pad(Math.floor(sec%3600/60))}:${pad(sec%60)}`; }
function parseDur(str, bare){ str = String(str||'').trim(); if (!str) return 0; if (str.includes(':')) { const p = str.split(':').map(Number); if (p.some(isNaN)) return NaN; return p.reduce((a,v) => a*60+v, 0); } const n = parseFloat(str.replace(',','.')); return isNaN(n) ? NaN : Math.round(bare==='min' ? n*60 : n); }
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? NaN : n; };
function niceMax(v){ if (!(v>0)) return 1; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; }
const pref = { get(k,d){ try { const v = localStorage.getItem('liftlog.'+k); return v==null ? d : JSON.parse(v); } catch { return d; } }, set(k,v){ try { localStorage.setItem('liftlog.'+k, JSON.stringify(v)); } catch {} } };

/* ================= state ================= */
const S = {
  ready:false, storeOk:true,
  view:'today', aid:pref.get('aid',null), date:today(), calMonth:today().slice(0,7),
  sheet:null, draft:{}, editIdx:null, addQ:'', addCat:null, confirm:null,
  gMetric:null, gRange:'6M', trendRange:'1M', ver:0, timer:null, importing:null,
  athletes:{}, custom:{}, routines:{}, installEvt:null
};
const DOCS = {};

function deepMerge(a, b){
  const out = (a && typeof a==='object' && !Array.isArray(a)) ? {...a} : {};
  if (!b || typeof b !== 'object') return out;
  for (const k of Object.keys(b)) {
    const v = b[k];
    if (v && typeof v==='object' && !Array.isArray(v) && out[k] && typeof out[k]==='object' && !Array.isArray(out[k])) out[k] = deepMerge(out[k], v);
    else out[k] = v;
  }
  return out;
}
function derive(){
  const ath = {}, custom = {}, routines = {};
  for (const p of Object.keys(DOCS)) { const parts = p.split('/'); if (parts[0]==='athletes' && parts.length===2 && DOCS[p] && DOCS[p].name) ath[parts[1]] = DOCS[p]; }
  const c = DOCS['library/custom']; if (c && c.items) for (const [k,v] of Object.entries(c.items)) if (v && v.name) custom[k] = v;
  const r = DOCS['library/routines']; if (r && r.items) for (const [k,v] of Object.entries(r.items)) if (v && v.name) routines[k] = v;
  S.athletes = ath; S.custom = custom; S.routines = routines;
  if (!S.athletes[S.aid]) { const ids = athleteIds(); S.aid = ids.find(id => S.athletes[id].me) || ids[0] || null; }
}
const athleteIds = () => Object.keys(S.athletes).sort((a,b) => (S.athletes[a].created||0) - (S.athletes[b].created||0));
const A = () => S.athletes[S.aid];
// Per-profile switch: false hides readiness, strain and the morning check-in everywhere.
const scoresOn = (aid = S.aid) => !!(S.athletes[aid] && S.athletes[aid].scores === true);
const unitOf = aid => (S.athletes[aid]||{}).unit || 'kg';
const unit = () => unitOf(S.aid);

/* ================= on-device storage (IndexedDB, localStorage fallback) ================= */
const DB = {
  idb:null,
  open(){ return new Promise((res, rej) => { if (!window.indexedDB) return rej(new Error('no idb')); const r = indexedDB.open('liftlog', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async init(){ try { this.idb = await this.open(); pref.set('usedIdb', true); } catch { this.idb = null; if (pref.get('usedIdb', false)) S.storeBlocked = true; } },
  req(mode, fn){ return new Promise((res, rej) => { const tx = this.idb.transaction('docs', mode); const st = tx.objectStore('docs'); const out = fn(st); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); }); },
  async loadAll(){
    if (!this.idb) { try { return JSON.parse(localStorage.getItem('liftlog.docs') || '{}'); } catch { return {}; } }
    const keys = await this.req('readonly', st => st.getAllKeys()); const vals = await this.req('readonly', st => st.getAll());
    const o = {}; keys.forEach((k,i) => { o[k] = vals[i]; }); return o;
  },

/* ---------- calendar ---------- */
function vCal(){

  const floor = ymAdd(cur, -(36 + (S.calBack||0)));

    }

const calCountText = n => n === 0 ? 'No workouts' : n === 1 ? '1 workout' : `${n} workouts`;

    const iDate = col(h => h === 'date'), iEx = col(h => h === 'exercise'), iCat = col(h => h === 'category');
    const iW = col(h => h.startsWith('weight') && !h.includes('unit')), iWU = col(h => h === 'weight unit'), iR = col(h => h === 'reps');
    const iD = col(h => h.startsWith('distance') && !h.includes('unit')), iDU = col(h => h === 'distance unit'), iT = col(h => h === 'time' || h.startsWith('time ') || h.startsWith('duration')), iC = col(h => h.startsWith('comment') || h === 'notes' || h === 'note');
    if (iDate < 0 || iEx < 0) throw new Error("That doesn't look like a FitNotes export. It needs Date and Exercise columns.");
    const hdrLb = iW >= 0 && /lb/.test(H[iW]);
    const byName = {}; allEx().forEach(e => { byName[e.name.toLowerCase().replace(/[^a-z0-9]/g,'')] = e.id; });
    const newEx = {}, flags = {}, days = {};
    for (const r of rows.slice(1)) {
      let date = (r[iDate]||'').trim(); if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { const d = new Date(date); if (isNaN(d)) continue; date = iso(d); }
      const exName = (r[iEx]||'').trim(); if (!exName) continue;
      const key = exName.toLowerCase().replace(/[^a-z0-9]/g,'');
      let id = byName[key];
      if (!id) { id = 'c-' + slug(exName).slice(0,40) + '-' + uid().slice(0,4); byName[key] = id; newEx[id] = {name:exName, cat:mapCat(iCat >= 0 ? r[iCat] : ''), type:'wr'}; }
      const s = {};
      const w = iW >= 0 ? num(r[iW]) : NaN; const wu = (iWU >= 0 ? r[iWU] : (hdrLb ? 'lbs' : 'kgs')).toLowerCase();
      if (w > 0) s.w = /lb/.test(wu) ? w*LB : w; else if (w === 0) s.w = 0;
      const rp = iR >= 0 ? parseInt(r[iR],10) : NaN; if (rp > 0) s.r = rp;
      const d = iD >= 0 ? num(r[iD]) : NaN; if (d > 0) { const du = (iDU >= 0 ? r[iDU] : 'km').toLowerCase().trim(); s.d = /^mi/.test(du) ? d*MI : du === 'm' ? d/1000 : /^(yd|yard)/.test(du) ? d*0.0009144 : /^(ft|feet)/.test(du) ? d*0.0003048 : d; }
      const tt = iT >= 0 ? parseDur(r[iT],'s') : 0; if (tt > 0) s.t = tt;
      const note = iC >= 0 ? (r[iC]||'').trim() : ''; if (note) s.note = note.slice(0,140);
      if (!s.r && !s.t && !s.d) continue;
      const fl = flags[id] = flags[id] || {}; if (s.w > 0) fl.w = 1; if (s.r) fl.r = 1; if (s.d) fl.d = 1; if (s.t) fl.t = 1;
      const day = days[date] = days[date] || {entries:[], note:'', rpe:null, t0:null, t1:null};
      let en = day.entries.find(e => e.ex === id); if (!en) { en = {ex:id, sets:[]}; day.entries.push(en); }
      en.sets.push(s);
    }
    for (const [id, ex] of Object.entries(newEx)) { const f = flags[id] || {}; ex.type = f.d ? 'dt' : (f.t && !f.r) ? 't' : (f.r && !f.w) ? 'r' : 'wr'; if (ex.type === 'dt' && ex.cat === 'other') ex.cat = 'cardio'; }
    const nDays = Object.keys(days).length; if (!nDays) throw new Error('No sets found in that file.');
    S.importing = `Importing ${nDays} workouts into ${name}'s log…`; render();
    if (Object.keys(newEx).length) await patchDoc('library/custom', {items:newEx});
    const months = {}; for (const [d, day] of Object.entries(days)) (months[d.slice(0,7)] = months[d.slice(0,7)] || {})[d] = day;
    for (const ym of Object.keys(months).sort()) await patchDoc(monthPath(aid, ym), {ym, days:months[ym]});
    S.importing = null; render(); toast(`Imported ${nDays} workouts${Object.keys(newEx).length ? ` and ${Object.keys(newEx).length} new exercises` : ''}`);
  } catch (e) { S.importing = null; render(); toast(e.message || "Couldn't import that file.", 'err'); }
}
function exportCSV(){
  const aid = S.aid, I = ix(aid), u = unitOf(aid), a = A();
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const rows = [['Date','Exercise','Category','Weight','Weight Unit','Reps','Distance','Distance Unit','Time','Comment']];
  for (const d of I.dates) for (const e of I.days[d].entries) { const m = exMeta(e.ex); for (const s of e.sets||[]) rows.push([d, m.name, CATS[m.cat].name, s.w != null ? wRaw(s.w,u) : '', s.w != null ? (u==='lb' ? 'lbs' : 'kgs') : '', s.r ?? '', s.d ? dRaw(s.d,u) : '', s.d ? distU(u) : '', s.t ? fmtDurH(s.t) : '', s.note || '']); }
  if (rows.length < 2) return toast('No workouts to export yet.', 'err');
  saveFile(`liftlog-${slug(a.name)}-${today()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}

/* ================= events ================= */
document.addEventListener('click', ev => {
  const navA = ev.target.closest('#nav a');
  if (navA && navA.dataset.nav === S.view && !S.sheet) { ev.preventDefault(); if (S.view === 'calendar') scrollToMonth(today().slice(0,7), true); else window.scrollTo({top:0, behavior:'smooth'}); return; }
  if (ev.target.id === 'datepick') { try { ev.target.showPicker && ev.target.showPicker(); } catch {} }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  if (!/^(removeex|delath|delrt)$/.test(el.dataset.act)) S.confirm = null;
  fn(el, ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.dlg) { closeDlg(); return; }
  if (ev.key === 'Escape' && S.menu) { S.menu = false; render(); return; }
  if (ev.key === 'Escape' && S.sheet) { ACT.close(); return; }
  if (ev.key === 'Enter' && S.sheet && S.sheet.kind === 'ex' && ev.target.closest && ev.target.closest('.fields, #in-note')) { ev.preventDefault(); ev.target.blur(); ACT.saveset(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.in === 'draft') S.draft[el.dataset.f] = el.value;
  else if (el.dataset.in === 'dlg' && S.dlg) { S.dlg[el.dataset.f] = el.value; if (el.dataset.f === 'roundTo' && num(el.value) > 0) pref.set('roundTo.'+S.dlg.u, num(el.value)); const o = $('#dl-out'); if (o) o.innerHTML = dlgOut(); }
  else if (el.dataset.in === 'addq') { S.addQ = el.value; const l = $('#exlist'); if (l) l.innerHTML = exListHTML(); }
});
document.addEventListener('change', ev => {
  const el = ev.target, k = el.dataset.ch; if (!k) return;
  if (k === 'date' && el.value) { S.date = el.value; render(); }
  else if (k === 'wnote') { const day = cloneDay(S.aid, S.date); if ((day.note||'') !== el.value) { day.note = el.value.slice(0,600); saveDay(S.aid, S.date, day); } }
  else if (k === 'aname') { const v = el.value.trim(); if (v) patchDoc(`athletes/${el.dataset.v}`, {name:v.slice(0,30)}); }
  else if (k === 'csv' && el.files && el.files[0]) runImport(el.files[0]);
  else if (k === 'bkmerge' && el.files && el.files[0]) loadBackup(el.files[0], 'merge');
  else if (k === 'bkreplace' && el.files && el.files[0]) loadBackup(el.files[0], 'replace');
  if (el.type === 'file') el.value = '';
});
function route(){ const h = (location.hash || '').slice(1); S.view = VIEWS[h] ? h : 'today'; if (S.sheet) clearSheet(); if (S.view === 'calendar') S.calJump = true; render(); if (S.view !== 'calendar') window.scrollTo(0,0); }
window.addEventListener('hashchange', route);
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 150); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'more') render(); });

/* ================= boot ================= */
async function init(){
  const h = (location.hash || '').slice(1); if (VIEWS[h]) S.view = h; if (S.view === 'calendar') S.calJump = true;
  await DB.init();
  if (S.storeBlocked) { S.ready = true; render(); return; }

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  const t = pref.get('timer', null); if (t && t.end && t.total) { S.timer = t; if (t.done || t.end < Date.now() - 60000) { S.timer = null; saveTimer(); } else armRest(); }
  S.ready = true; changed();
}
init();
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
