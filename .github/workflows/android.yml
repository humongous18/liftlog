name: Build Android app

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub Release with this version (e.g. 1.0.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"; PUBLISH=true
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            V="${{ github.event.inputs.version }}"; PUBLISH=true
          elif [[ -f ../VERSION && "${GITHUB_REF}" == refs/heads/main ]]; then
            # Bumping the VERSION file on main publishes that version once.
            V="$(tr -d '[:space:]' < ../VERSION)"
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              V="$V-dev.${{ github.run_number }}"
            else
              PUBLISH=true
            fi
          else
            V="1.0.${{ github.run_number }}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "Version $V (publish: $PUBLISH)"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret found. Signed with a temporary key: background sync to Habits will NOT work, and updates will need an uninstall. Add the same four secrets as the Habits repo."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Liftlog-${VERSION_NAME}.apk"

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error: |What went wrong|AAPT: error|Execution failed" -A2 build.log | head -60 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line//%/%25}"
          done || true

      - uses: actions/upload-artifact@v4
        with:
          name: Liftlog-${{ steps.ver.outputs.name }}
          path: android/out/*.apk

      - name: Publish GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Liftlog ${{ steps.ver.outputs.name }}
          files: android/out/*.apk
          generate_release_notes: true
